<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflections — An Honest Conversation</title>
<style>
  :root{
    --emerald-950:#0a2e24;
    --emerald-900:#0d3d2f;
    --emerald-800:#12503e;
    --gold-400:#e0c26b;
    --gold-500:#d4af6a;
    --gold-600:#b8933f;
    --cream:#faf6ee;
    --cream-2:#f3ede0;
    --card-bg:#fffdf8;
    --ink:#1c211f;
    --ink-soft:#5b6560;
    --line:#e7e2d4;
    --ig-gradient: linear-gradient(45deg, #FEDA75 0%, #FA7E1E 25%, #D62976 50%, #962FBF 75%, #4F5BD5 100%);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg,#e9e4d6, #dcd6c4 40%, #cfc8b3);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 12px 80px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
  }
  .phone{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:34px;
    box-shadow:0 30px 60px -20px rgba(20,30,25,0.45), 0 2px 0 rgba(255,255,255,0.6) inset;
    overflow:hidden;
    border:6px solid #16150f;
  }
  .app-header{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px 16px 12px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; background:#fff; z-index:5;
  }
  .app-header .logo{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
    font-size:1.35rem;
    letter-spacing:0.2px;
    background:linear-gradient(120deg,var(--emerald-900),var(--gold-600));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .feed{ padding-bottom:12px; }

  .post{ padding:14px 0 6px; border-bottom:8px solid var(--cream-2); }
  .post:last-child{ border-bottom:none; }

  .post-head{
    display:flex; align-items:center; gap:10px;
    padding:0 14px 10px;
  }
  .avatar{
    width:34px; height:34px; border-radius:50%;
    padding:2px;
    background:var(--ig-gradient);
    flex-shrink:0;
  }
  .avatar span{
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%; border-radius:50%;
    background:var(--emerald-950);
    color:var(--gold-400); font-family:Georgia,serif; font-weight:700; font-size:0.82rem;
    border:2px solid #fff;
  }
  .post-head .who{ line-height:1.15; min-width:0; }
  .post-head .uname{ font-weight:600; font-size:0.92rem; color:var(--ink); }

  /* ---- carousel (native scroll-snap: fixes touch drag + backward-swipe bugs) ---- */
  .deck-wrap{ padding:0 14px; }
  @property --run-angle{
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes run-light-spin{
    from{ --run-angle:0deg; }
    to{ --run-angle:360deg; }
  }
  .ig-carousel{
    position:relative;
    width:100%;
    aspect-ratio: 4/5;
    border-radius:14px;
    overflow:hidden;
    background:var(--card-bg);
    border:1px solid var(--line);
    box-shadow:0 8px 20px -12px rgba(20,30,25,0.35);
    container-type: inline-size;
    container-name: card;
  }
  .ig-track{
    display:flex;
    height:100%;
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    gap:10px;
    padding:0 6%;
  }
  .ig-track::-webkit-scrollbar{ display:none; }
  .ig-slide{
    flex:0 0 88%;
    height:100%;
    position:relative;
    scroll-snap-align:center;
    scroll-snap-stop:always;
    opacity:0.5;
    transform:scale(0.94);
    transition:opacity .25s, transform .25s;
  }
  .ig-slide.is-active{ opacity:1; transform:scale(1); }
  .ig-slide-inner{
    position:absolute; inset:0;
    background:var(--card-bg);
    border-radius:12px;
    color:var(--ink);
    padding:6.2cqw 4.8cqw 4.2cqw;
    display:flex; flex-direction:column;
  }
  .slide-body{
    font-family:Georgia,Cambria,"Iowan Old Style","Palatino Linotype",Palatino,serif;
    font-size:clamp(0.76rem, 4.3cqw, 1.05rem); line-height:1.62; color:#2b2f2c;
    letter-spacing:0.1px;
    position:relative;
    overflow:hidden;
    flex:1;
    min-height:0;
    display:flex; flex-direction:column; justify-content:center;
  }
  .slide-body p{ margin:0 0 2.8cqw; }
  .slide-body p:last-child{ margin-bottom:0; }

  /* ---- chapter cover slide (one per carousel) ---- */
  .chapter-inner{
    justify-content:center; align-items:center; text-align:center;
    background:linear-gradient(165deg, #fffdf8, #f6f0dd 130%);
  }
  .chapter-kicker{
    font-size:clamp(0.6rem, 2.9cqw, 0.72rem);
    letter-spacing:3px; text-transform:uppercase;
    color:var(--gold-600); font-weight:700;
  }
  .chapter-emblem{ color:var(--gold-500); margin:3cqw 0; }
  .chapter-emblem svg{ width:clamp(18px,7cqw,26px); height:clamp(18px,7cqw,26px); }
  .chapter-title{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(1.25rem, 7.6cqw, 1.85rem); line-height:1.2;
    color:var(--emerald-900);
    margin-bottom:2.8cqw;
  }
  .chapter-tagline{
    font-family:Georgia,serif; font-style:italic;
    font-size:clamp(0.74rem, 3.8cqw, 0.92rem);
    color:var(--ink-soft);
  }

  .ig-badge{
    position:absolute; top:10px; right:10px;
    background:var(--emerald-900); color:var(--cream); font-size:0.74rem; font-weight:800;
    padding:4px 11px; border-radius:20px; z-index:3; letter-spacing:0.3px;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }
  .ig-dots{
    display:flex; justify-content:center; gap:6px; padding:10px 0 2px;
  }
  .ig-dots .dot{
    width:7px; height:7px; border-radius:50%;
    background:#ddd6c4; border:none; cursor:pointer; padding:0;
    transition:all .2s;
  }
  .ig-dots .dot.active{ background:var(--gold-600); width:18px; border-radius:5px; }

  .nudge-hint{
    position:absolute; right:10px; bottom:10px; z-index:4;
    display:inline-flex; align-items:center;
    padding:5px 12px;
    border-radius:20px;
    background:#fff8ea;
    border:1px solid var(--gold-600);
    color:var(--emerald-900); font-weight:700; letter-spacing:0.3px;
    font-size:clamp(0.6rem, 2.9cqw, 0.7rem);
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
    opacity:0; transition:opacity .3s; pointer-events:none;
  }
  .nudge-hint.show{ opacity:1; }
  .nudge-hint::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:20px;
    padding:1.5px;
    background:conic-gradient(from var(--run-angle), transparent 0deg, transparent 300deg, var(--gold-500) 330deg, #fff8e4 345deg, var(--gold-500) 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:0;
  }
  .nudge-hint.run-light::after{
    opacity:1;
    animation:run-light-spin 1.3s linear;
  }

  /* ---- citation & reflection blocks (inside slides) ---- */
  .blk-cite{
    background:#f6f1e4;
    color:var(--ink);
    border-radius:9px;
    padding:3.2cqw 3.6cqw;
    margin:1.6cqw 0 2.6cqw;
    border-left:3px solid var(--gold-500);
  }
  .blk-cite .cite-kicker{
    font-size:clamp(0.52rem, 2.6cqw, 0.6rem); letter-spacing:1.1px; text-transform:uppercase;
    color:#93897a; font-weight:700; margin-bottom:1.2cqw;
  }
  .blk-cite .cite-text{
    font-family:Georgia,"Times New Roman",serif; font-style:italic;
    font-size:clamp(0.68rem, 3.85cqw, 0.86rem); line-height:1.38; color:#242a26; margin:0;
  }
  .blk-reflect{
    background:var(--emerald-900);
    border-left:3px solid var(--gold-500);
    border-radius:9px;
    padding:3.2cqw 3.6cqw;
    margin:1.6cqw 0 2.6cqw;
  }
  .blk-reflect .refl-kicker{
    font-family:Georgia,serif; font-style:italic; color:var(--gold-400);
    font-size:clamp(0.66rem, 3.4cqw, 0.74rem); margin-bottom:1cqw; display:flex; align-items:center; gap:6px;
  }
  .blk-reflect .refl-text{
    font-family:Georgia,serif; font-style:italic; color:#f2ede0;
    font-size:clamp(0.66rem, 3.75cqw, 0.84rem); line-height:1.38; margin:0;
  }

  /* ---- in-card reference links: highlighted underline, never a pill ---- */
  .ref-pill{
    color:var(--emerald-900);
    font-weight:700;
    text-decoration:underline;
    text-decoration-color:var(--gold-600);
    text-decoration-thickness:1.5px;
    text-underline-offset:2px;
    background:#ffffff;
    padding:0.05em 0.3em;
    border-radius:3px;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
  }
  .cite-ref-wrap{ margin-top:1.6cqw; }
  .cite-ref-link{ font-size:clamp(0.54rem, 2.6cqw, 0.62rem); }
  .source-pill-wrap{ margin-top:1.8cqw; flex-shrink:0; }
  .slide-source-pill{ font-size:clamp(0.56rem, 2.7cqw, 0.66rem); }

  footer{
    text-align:center; color:#6b6355; font-size:0.75rem; padding:22px 10px 0;
    max-width:420px;
  }
</style>
</head>
<body>

function domainLabel(url){
  if(url.includes('sunnah.com')) return 'Sunnah.com';
  if(url.includes('quran.com')) return 'Quran.com';
  if(url.includes('wikipedia.org')) return 'Wikipedia';
  try{ return new URL(url).hostname.replace(/^www\./,''); } catch(e){ return url; }
}

function renderBlock(b){
  if(typeof b === 'string') return `<p>${b}</p>`;
  if(b.type === 'cite'){
    const shortRef = b.ref.split('·')[0].trim();
    const domain = domainLabel(b.url);
    return `
      <div class="blk-cite">
        <div class="cite-kicker">${b.kicker || 'Authentic Narration'}</div>
        <p class="cite-text">&ldquo;${b.text}&rdquo;</p>
        <div class="cite-ref-wrap"><a class="ref-pill cite-ref-link" href="${b.url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">See ${shortRef} on ${domain}</a></div>
      </div>`;
  }
  if(b.type === 'reflect'){
    return `
      <div class="blk-reflect">
        <div class="refl-kicker">&#10078; Reflection</div>
        <p class="refl-text">${b.text}</p>
      </div>`;
  }
  return '';
}

function buildSlideHTML(item){
  const bodyHtml = item.body.map(renderBlock).join('');
  const hasCite = item.body.some(b => b && typeof b === 'object' && b.type === 'cite');
  let sourcePill = '';
  if(!hasCite && item.source){
    const domain = domainLabel(item.source.url);
    sourcePill = `<div class="source-pill-wrap"><a class="ref-pill slide-source-pill" href="${item.source.url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">See ${item.source.label} on ${domain}</a></div>`;
  }
  return `
    <div class="ig-slide-inner">
      <div class="slide-body">${bodyHtml}</div>
      ${sourcePill}
    </div>`;
}

const CHAPTER_EMBLEM = `<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M20 4 L23 17 L36 20 L23 23 L20 36 L17 23 L4 20 L17 17 Z"/></svg>`;

function buildChapterSlideHTML(post, num){
  return `
    <div class="ig-slide-inner chapter-inner">
      <div class="chapter-kicker">Chapter ${num}</div>
      <div class="chapter-emblem">${CHAPTER_EMBLEM}</div>
      <div class="chapter-title">${post.chapterTitle}</div>
      <div class="chapter-tagline">${post.sub}</div>
    </div>`;
}

function renderPost(post, idx){
  return `
    <article class="post" data-deck="${post.deck}">
      <header class="post-head">
        <div class="avatar"><span>${idx + 1}</span></div>
        <div class="who">
          <div class="uname">${post.uname}</div>
        </div>
      </header>
      <div class="deck-wrap">
        <div class="ig-carousel">
          <div class="ig-track"></div>
          <div class="ig-badge"></div>
          <div class="nudge-hint">swipe</div>
        </div>
        <div class="ig-dots"></div>
      </div>
    </article>`;
}

class Deck{
  constructor(article, post, num){
    this.article = article;
    this.key = article.dataset.deck;
    this.post = post;
    this.num = num;
    this.items = DATA[this.key];
    this.carousel = article.querySelector('.ig-carousel');
    this.track = article.querySelector('.ig-track');
    this.dotsEl = article.querySelector('.ig-dots');
    this.badgeEl = article.querySelector('.ig-badge');
    this.hint = article.querySelector('.nudge-hint');
    this.current = 0;
    this.interacted = false;
    this.scrollRaf = null;
    this.nudgeTimer = null;
    this._build();
    this._updateUI(false);
    this._bind();
    this._armNudge();
  }
  _build(){
    const chapterHTML = `<div class="ig-slide">${buildChapterSlideHTML(this.post, this.num)}</div>`;
    const cardHTML = this.items.map(item => `<div class="ig-slide">${buildSlideHTML(item)}</div>`).join('');
    this.track.innerHTML = chapterHTML + cardHTML;
    this.slideEls = [...this.track.children];
    this.total = this.slideEls.length;
    this.dotsEl.innerHTML = this.slideEls.map((_, i) => `<button class="dot" data-i="${i}" aria-label="slide ${i+1}"></button>`).join('');
    this.dotEls = [...this.dotsEl.children];
  }
  _updateUI(animate = true){
    this.slideEls.forEach((el, idx) => el.classList.toggle('is-active', idx === this.current));
    this.dotEls.forEach((d, idx) => d.classList.toggle('active', idx === this.current));
    this.badgeEl.textContent = `${this.current + 1}/${this.total}`;
  }
  _goTo(i){
    this.current = Math.max(0, Math.min(this.total - 1, i));
    this.slideEls[this.current].scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    this._updateUI();
  }
  _closestIndex(){
    const trackRect = this.track.getBoundingClientRect();
    const centerX = trackRect.left + trackRect.width / 2;
    let best = 0, bestDist = Infinity;
    this.slideEls.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const c = r.left + r.width / 2;
      const d = Math.abs(c - centerX);
      if(d < bestDist){ bestDist = d; best = i; }
    });
    return best;
  }
  _bind(){
    this.dotEls.forEach((d, i) => d.addEventListener('click', () => { this._markInteracted(); this._goTo(i); }));
    this.track.addEventListener('pointerdown', () => this._markInteracted(), { passive:true });
    this.track.addEventListener('scroll', () => {
      if(this.scrollRaf) return;
      this.scrollRaf = requestAnimationFrame(() => {
        this.scrollRaf = null;
        const idx = this._closestIndex();
        if(idx !== this.current){
          this.current = idx;
          this._updateUI();
        }
      });
    }, { passive:true });
  }
  _markInteracted(){
    if(this.interacted) return;
    this.interacted = true;
    clearInterval(this.nudgeTimer);
    this.hint.classList.remove('show', 'run-light');
  }
  _armNudge(){
    const pulse = () => {
      if(this.interacted) return;
      this.hint.classList.add('show', 'run-light');
      setTimeout(() => {
        this.hint.classList.remove('show', 'run-light');
      }, 1300);
    };
    setTimeout(pulse, 1600);
    this.nudgeTimer = setInterval(pulse, 4500);
  }
}

document.getElementById('feed').innerHTML = POSTS.map(renderPost).join('');
document.querySelectorAll('.post').forEach((article, idx) => new Deck(article, POSTS[idx], idx + 1));
</script>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflections — An Honest Conversation</title>
<style>
  :root{
    --emerald-950:#0a2e24;
    --emerald-900:#0d3d2f;
    --emerald-800:#12503e;
    --gold-400:#e0c26b;
    --gold-500:#d4af6a;
    --gold-600:#b8933f;
    --cream:#faf6ee;
    --cream-2:#f3ede0;
    --ink:#1c211f;
    --ink-soft:#5b6560;
    --line:#e7e2d4;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg,#e9e4d6, #dcd6c4 40%, #cfc8b3);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 12px 80px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
  }
  .phone{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:34px;
    box-shadow:0 30px 60px -20px rgba(20,30,25,0.45), 0 2px 0 rgba(255,255,255,0.6) inset;
    overflow:hidden;
    border:6px solid #16150f;
  }
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px 12px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; background:#fff; z-index:5;
  }
  .app-header .logo{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
    font-size:1.35rem;
    letter-spacing:0.2px;
    background:linear-gradient(120deg,var(--emerald-900),var(--gold-600));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .app-header .icons{ display:flex; gap:16px; color:var(--ink); }
  .app-header svg{ width:22px; height:22px; }

  .feed{ padding-bottom:12px; }

  .post{ padding:14px 0 6px; border-bottom:8px solid var(--cream-2); }
  .post:last-child{ border-bottom:none; }

  .post-head{
    display:flex; align-items:center; gap:10px;
    padding:0 14px 10px;
  }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    padding:2px;
    background:conic-gradient(from 210deg, var(--gold-500), var(--emerald-800), var(--gold-500));
    flex-shrink:0;
  }
  .avatar span{
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%; border-radius:50%;
    background:var(--emerald-950);
    color:var(--gold-400); font-family:Georgia,serif; font-weight:700; font-size:0.95rem;
    border:2px solid #fff;
  }
  .post-head .who{ line-height:1.15; min-width:0; }
  .post-head .uname{ font-weight:600; font-size:0.92rem; }
  .post-head .sub{ font-size:0.78rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .post-head .dots{ margin-left:auto; color:var(--ink-soft); font-size:1.3rem; padding:4px; }

  /* ---- Instagram-style carousel ---- */
  .deck-wrap{ padding:0 14px; }
  .ig-carousel{
    position:relative;
    width:100%;
    aspect-ratio: 4/5;
    border-radius:14px;
    overflow:hidden;
    background:var(--emerald-950);
    touch-action:pan-y;
  }
  .ig-track{
    display:flex;
    height:100%;
    width:100%;
    transform:translateX(0);
    transition:transform .32s cubic-bezier(.22,.8,.25,1);
    will-change:transform;
  }
  .ig-track.dragging{ transition:none; }
  .ig-slide{
    flex:0 0 100%;
    height:100%;
    position:relative;
    overflow:hidden;
  }
  .ig-slide-inner{
    position:absolute; inset:0;
    background:linear-gradient(155deg,var(--emerald-900),var(--emerald-950) 60%);
    color:var(--cream);
    padding:24px 20px 18px;
    display:flex; flex-direction:column;
  }
  .ig-slide-inner::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 15% 12%, rgba(224,194,107,0.16), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(224,194,107,0.12), transparent 45%);
    pointer-events:none;
  }
  .slide-kicker{
    font-size:0.68rem; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--gold-400); font-weight:700; position:relative;
  }
  .slide-title{
    font-family:Georgia,"Times New Roman",serif;
    font-size:1.4rem; line-height:1.24; margin:9px 0 10px;
    position:relative;
  }
  .slide-body{
    font-size:0.92rem; line-height:1.5; color:#eef4ef;
    position:relative;
    overflow-y:auto;
    flex:1;
    min-height:0;
    padding-right:2px;
  }
  .slide-body p{ margin:0 0 9px; }
  .slide-body p:last-child{ margin-bottom:0; }

  .slide-fade{
    position:absolute; left:0; right:0; bottom:0; height:28px;
    background:linear-gradient(to bottom, rgba(10,46,36,0), rgba(9,38,30,0.9));
    pointer-events:none; z-index:2;
  }

  .ig-badge{
    position:absolute; top:10px; right:10px;
    background:rgba(0,0,0,0.5); color:#fff; font-size:0.68rem; font-weight:700;
    padding:3px 9px; border-radius:20px; z-index:3; letter-spacing:0.3px;
  }
  .ig-dots{
    position:absolute; bottom:10px; left:0; right:0;
    display:flex; justify-content:center; gap:5px; z-index:3;
  }
  .ig-dots .dot{ width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.4); transition:all .2s; }
  .ig-dots .dot.active{ background:#fff; width:6px; height:6px; }


  .nudge-hint{
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    background:rgba(10,20,16,0.6); color:#fff; font-size:0.72rem;
    padding:5px 11px; border-radius:20px; z-index:4;
    opacity:0; transition:opacity .3s; pointer-events:none;
  }
  .nudge-hint.show{ opacity:1; }

  /* ---- citation & reflection blocks (inside slides) ---- */
  .blk-cite{
    background:var(--cream);
    color:var(--ink);
    border-radius:12px;
    padding:12px 14px;
    margin:6px 0 12px;
    border-left:3px solid var(--gold-500);
    box-shadow:0 4px 12px -6px rgba(0,0,0,0.3);

  .blk-cite .cite-kicker{

    color:#93897a; font-weight:700; margin-bottom:6px;
  }
  .blk-cite .cite-text{
    font-family:Georgia,"Times New Roman",serif; font-style:italic;
    font-size:0.87rem; line-height:1.46; color:#242a26; margin:0;
  }
  .blk-cite .cite-ref{
    display:block; margin-top:8px;
    font-size:0.64rem; letter-spacing:0.4px; text-transform:uppercase;
    color:#93897a; font-weight:700;
  }
  .blk-reflect{
    background:rgba(0,0,0,0.2);
    border:1px solid rgba(224,194,107,0.4);
    border-left:3px solid var(--gold-500);
    border-radius:12px;
    padding:12px 14px;
    margin:6px 0 12px;
  }
  .blk-reflect .refl-kicker{
    font-family:Georgia,serif; font-style:italic; color:var(--gold-400);
    font-size:0.76rem; margin-bottom:4px; display:flex; align-items:center; gap:6px;
  }
  .blk-reflect .refl-text{
    font-family:Georgia,serif; font-style:italic; color:#f2ede0;
    font-size:0.85rem; line-height:1.46; margin:0;
  }

  /* ---- reference row (replaces like/comment/share) ---- */
  .ref-row{ padding:11px 14px 2px; }
  .ref-link{
    display:inline-flex; align-items:center; gap:7px;
    font-size:0.78rem; font-weight:700; color:var(--emerald-900);
    text-decoration:none; border:1px solid var(--gold-600);
    background:#fff8ea; padding:7px 13px; border-radius:20px;
    max-width:100%;
  }
  .ref-link span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ref-link svg{ width:13px; height:13px; flex-shrink:0; }
  .ref-link:active{ transform:scale(0.97); }

  .post-caption{ padding:8px 14px 4px; font-size:0.88rem; line-height:1.4; }
  .post-caption b{ font-weight:600; }
  .post-caption .cap-title{ color:var(--ink-soft); }

  footer{
    text-align:center; color:#6b6355; font-size:0.75rem; padding:22px 10px 0;
    max-width:420px;
  }
</style>
</head>

function renderBlock(b){
  if(typeof b === 'string') return `<p>${b}</p>`;
  if(b.type === 'cite'){
    return `
      <div class="blk-cite">
        <div class="cite-kicker">Authentic Narration</div>
        <p class="cite-text">&ldquo;${b.text}&rdquo;</p>
        <span class="cite-ref">${b.ref}</span>
      </div>`;
  }
  if(b.type === 'reflect'){
    return `
      <div class="blk-reflect">
        <div class="refl-kicker">&#10078; Reflection</div>
        <p class="refl-text">${b.text}</p>
      </div>`;
  }
  return '';
}

function findCiteUrl(body){
  const c = body.find(b => b && typeof b === 'object' && b.type === 'cite');
  return c ? { label:'Verify on Sunnah.com', url:c.url } : null;
}

function buildSlideHTML(item){
  const bodyHtml = item.body.map(renderBlock).join('');
  return `
    <div class="ig-slide-inner">
      <div class="slide-title">${item.title}</div>
      <div class="slide-body">${bodyHtml}</div>
      <div class="slide-fade"></div>
    </div>`;
}

const LINK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>`;

function renderPost(post){
  return `
    <article class="post" data-deck="${post.deck}">
      <header class="post-head">
        <div class="avatar"><span>${post.avatar[0]}</span></div>
        <div class="who">
          <div class="uname">${post.uname}</div>
          <div class="sub">${post.sub}</div>
        </div>
        <div class="dots">&#8942;</div>
      </header>
      <div class="deck-wrap">
        <div class="ig-carousel">
          <div class="ig-track"></div>
          <div class="ig-badge"></div>
          <div class="ig-dots"></div>
          <div class="nudge-hint">swipe</div>
        </div>
      </div>
      <div class="ref-row">
        <a class="ref-link" href="#" target="_blank" rel="noopener noreferrer">
          ${LINK_ICON}
          <span></span>
        </a>
      </div>
      <div class="post-caption"><b>${post.uname}</b> <span class="cap-title">${post.caption}</span></div>
    </article>`;
}

class Deck{
  constructor(article){
    this.article = article;
    this.key = article.dataset.deck;
    this.items = DATA[this.key];
    this.carousel = article.querySelector('.ig-carousel');
    this.track = article.querySelector('.ig-track');
    this.dotsEl = article.querySelector('.ig-dots');
    this.badgeEl = article.querySelector('.ig-badge');
    this.refLink = article.querySelector('.ref-link');
    this.refLabel = article.querySelector('.ref-link span');
    this.hint = article.querySelector('.nudge-hint');
    this.current = 0;
    this.interacted = false;
    this.dragging = false;
    this.nudgeTimer = null;
    this._build();
    this._goTo(0, false);
    this._bind();
    this._armNudge();
  }
  _build(){
    this.track.innerHTML = this.items.map(item => `<div class="ig-slide">${buildSlideHTML(item)}</div>`).join('');
    this.dotsEl.innerHTML = this.items.map((_, i) => `<span class="dot" data-i="${i}"></span>`).join('');
  }
  _goTo(i, animate = true){
    this.current = Math.max(0, Math.min(this.items.length - 1, i));
    this.track.style.transition = animate ? '' : 'none';
    this.track.style.transform = `translateX(-${this.current * 100}%)`;
    if(!animate){
      void this.track.offsetWidth;
      this.track.style.transition = '';
    }
    [...this.dotsEl.children].forEach((d, idx) => d.classList.toggle('active', idx === this.current));
    this.badgeEl.textContent = `${this.current + 1}/${this.items.length}`;
    this._updateRef();
  }
  _updateRef(){
    const item = this.items[this.current];
    const src = item.source || findCiteUrl(item.body);
    if(src){
      this.refLink.style.display = 'inline-flex';
      this.refLink.href = src.url;
      this.refLabel.textContent = src.label;
    } else {
      this.refLink.style.display = 'none';
    }
  }
  _bind(){
    [...this.dotsEl.children].forEach((d, i) => d.addEventListener('click', () => { this._markInteracted(); this._goTo(i); }));

    let startX = 0, width = 0;
    this.track.addEventListener('pointerdown', (e) => {
      this._markInteracted();
      this.dragging = true;
      startX = e.clientX;
      width = this.carousel.clientWidth;
      this.track.classList.add('dragging');
      this.track.setPointerCapture(e.pointerId);
    });
    this.track.addEventListener('pointermove', (e) => {
      if(!this.dragging) return;
      const dx = e.clientX - startX;
      this.track.style.transform = `translateX(calc(-${this.current * 100}% + ${dx}px))`;
    });
    const endDrag = (e) => {
      if(!this.dragging) return;
      this.dragging = false;
      this.track.classList.remove('dragging');
      const dx = e.clientX - startX;
      if(Math.abs(dx) > width * 0.15){
        this._goTo(this.current + (dx < 0 ? 1 : -1));
      } else {
        this._goTo(this.current);
      }
    };
    this.track.addEventListener('pointerup', endDrag);
    this.track.addEventListener('pointercancel', endDrag);
  }
  _markInteracted(){
    if(this.interacted) return;
    this.interacted = true;
    clearInterval(this.nudgeTimer);
    this.hint.classList.remove('show');
  }
  _armNudge(){
    const pulse = () => {
      if(this.interacted) return;
      const base = `translateX(-${this.current * 100}%)`;
      this.track.style.transform = `${base} translateX(-16px)`;
      this.hint.classList.add('show');
      setTimeout(() => {
        this.track.style.transform = base;
        setTimeout(() => this.hint.classList.remove('show'), 500);
      }, 260);
    };
    setTimeout(pulse, 1600);
    this.nudgeTimer = setInterval(pulse, 4500);
  }
}

document.getElementById('feed').innerHTML = POSTS.map(renderPost).join('');
document.querySelectorAll('.post').forEach(article => new Deck(article));
</script>
</body>
